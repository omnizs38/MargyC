name: Channel

# Канал обновлений должен быть в порядке: версия в version.json совпадает с кодом,
# хеш APK совпадает с объявленным. Если оригинальный мод снова начали править —
# заводим об этом issue, чтобы не потерять его изменения.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [Download]

jobs:
  channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Канал совпадает с исходниками
        run: python3 tools/release.py check

  upstream:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Оригинальный мод обновился?
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}
        run: |
          python3 tools/check_upstream.py --issue --update
          git config user.name "clawdio-bot"
          git config user.email "clawdio-bot@users.noreply.github.com"
          git add .github/upstream.json
          git diff --cached --quiet || (git commit -m "upstream: обновление оригинального мода" && git push)
